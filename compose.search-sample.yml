name: smart-calendar-search-sample
services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: ${SEARCH_SAMPLE_DB_NAME:?Set the dedicated sample database name}
      POSTGRES_USER: ${SEARCH_SAMPLE_DB_USER:?Set the sample database user}
      POSTGRES_PASSWORD: ${SEARCH_SAMPLE_DB_PASSWORD:?Set a local sample password}
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=en_US.utf8
    ports:
      - "127.0.0.1:${SEARCH_SAMPLE_DB_PORT:?Set the sample host port}:5432"
    volumes:
      - search_sample_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  search_sample_data:
